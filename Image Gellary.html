
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            font-size: 2.4rem;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            line-height: 1.6;
        }

        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 20px 30px;
        }

        .filter-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #333;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #176b5b;
            color: white;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: #ddd;
            aspect-ratio: 4 / 3;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, 0.8)
            );
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .overlay,
        .gallery-item:focus-visible .overlay {
            opacity: 1;
        }

        .overlay h3 {
            margin-bottom: 5px;
        }

        .overlay p {
            font-size: 14px;
        }

        .gallery-item.hidden {
            display: none;
        }

        
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.94);
            align-items: center;
            justify-content: center;
            padding: 60px 70px;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-content {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-caption {
            color: white;
            margin-top: 12px;
        }

        .lightbox button {
            position: absolute;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 38px;
            padding: 8px;
        }

        .close-btn {
            top: 15px;
            right: 25px;
        }

        .prev-btn {
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .next-btn {
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox button:hover {
            color: #8ee0c5;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }


        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        
        @media (max-width: 550px) {
            header h1 {
                font-size: 1.8rem;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .lightbox {
                padding: 55px 15px;
            }

            .prev-btn {
                left: 0;
            }

            .next-btn {
                right: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful images of nature, architecture, and animals.</p>
    </header>

    <nav class="filters" aria-label="Filter gallery images">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="architecture">
            Architecture
        </button>
        <button class="filter-btn" data-filter="animals">Animals</button>
    </nav>

    <main>
        <section class="gallery" id="gallery" aria-label="Image gallery">

            <article class="gallery-item"
                data-category="nature"
                tabindex="0"
                role="button"
                aria-label="View Mountain Landscape">
                <img
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
                    alt="Beautiful green mountain landscape">
                <div class="overlay">
                    <h3>Mountain Landscape</h3>
                    <p>Nature</p>
                </div>
            </article>

            <article class="gallery-item"
                data-category="architecture"
                tabindex="0"
                role="button"
                aria-label="View Modern Architecture">
                <img
                    src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=900&q=80"
                    alt="Modern white architectural building">
                <div class="overlay">
                    <h3>Modern Architecture</h3>
                    <p>Architecture</p>
                </div>
            </article>

            <article class="gallery-item"
                data-category="animals"
                tabindex="0"
                role="button"
                aria-label="View Cat">
                <img
                    src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=900&q=80"
                    alt="Cat looking toward the camera">
                <div class="overlay">
                    <h3>Lovely Cat</h3>
                    <p>Animals</p>
                </div>
            </article>

            <article class="gallery-item"
                data-category="nature"
                tabindex="0"
                role="button"
                aria-label="View Forest">
                <img
                    src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=80"
                    alt="Sunlight shining through a green forest">
                <div class="overlay">
                    <h3>Green Forest</h3>
                    <p>Nature</p>
                </div>
            </article>

            <article class="gallery-item"
                data-category="architecture"
                tabindex="0"
                role="button"
                aria-label="View City Building">
                <img
                    src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=900&q=80"
                    alt="Tall modern buildings in a city">
                <div class="overlay">
                    <h3>City Building</h3>
                    <p>Architecture</p>
                </div>
            </article>

            <article class="gallery-item"
                data-category="animals"
                tabindex="0"
                role="button"
                aria-label="View Dog">
                <img
                    src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=900&q=80"
                    alt="Golden dog outdoors">
                <div class="overlay">
                    <h3>Happy Dog</h3>
                    <p>Animals</p>
                </div>
            </article>

        </section>
    </main>

    <footer>
        <p>Responsive Image Gallery </p>
    </footer>

    
    <div
        class="lightbox"
        id="lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Image viewer">

        <button class="close-btn" id="closeBtn"
            aria-label="Close image viewer">&times;</button>

        <button class="prev-btn" id="prevBtn"
            aria-label="Previous image">&#10094;</button>

        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            <p class="lightbox-caption" id="lightboxCaption"></p>
        </div>

        <button class="next-btn" id="nextBtn"
            aria-label="Next image">&#10095;</button>
    </div>

    <script>
        
        const filterButtons = document.querySelectorAll(".filter-btn");
        const galleryItems = document.querySelectorAll(".gallery-item");

        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxCaption = document.getElementById("lightboxCaption");

        const closeBtn = document.getElementById("closeBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        
        let visibleItems = [...galleryItems];
        let currentIndex = 0;
        let previousFocus = null;

    
        filterButtons.forEach(function(button) {
            button.addEventListener("click", function() {
                const selectedFilter = button.dataset.filter;

                filterButtons.forEach(function(btn) {
                    btn.classList.remove("active");
                });

                button.classList.add("active");

                galleryItems.forEach(function(item) {
                    const category = item.dataset.category;

                    if (
                        selectedFilter === "all" ||
                        category === selectedFilter
                    ) {
                        item.classList.remove("hidden");
                    } else {
                        item.classList.add("hidden");
                    }
                });

                visibleItems = [...galleryItems].filter(function(item) {
                    return !item.classList.contains("hidden");
                });

            
                if (
                    lightbox.classList.contains("open") &&
                    !visibleItems.includes(galleryItems[currentIndex])
                ) {
                    closeLightbox();
                }
            });
        });

        
        function openLightbox(item) {
            visibleItems = [...galleryItems].filter(function(galleryItem) {
                return !galleryItem.classList.contains("hidden");
            });

            currentIndex = visibleItems.indexOf(item);

            if (currentIndex === -1) {
                return;
            }

            previousFocus = item;
            lightbox.classList.add("open");
            document.body.style.overflow = "hidden";

            showImage(currentIndex);
            closeBtn.focus();
        }

        
        function showImage(index) {
            const item = visibleItems[index];

            if (!item) {
                return;
            }

            const image = item.querySelector("img");
            const title = item.querySelector("h3");

            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;
            lightboxCaption.textContent = title.textContent;
        }

        
        function closeLightbox() {
            lightbox.classList.remove("open");
            document.body.style.overflow = "";

            if (previousFocus) {
                previousFocus.focus();
            }
        }


        function showNext() {
            if (visibleItems.length === 0) {
                return;
            }

            currentIndex = (currentIndex + 1) % visibleItems.length;
            showImage(currentIndex);
        }

        
        function showPrevious() {
            if (visibleItems.length === 0) {
                return;
            }

            currentIndex =
                (currentIndex - 1 + visibleItems.length) %
                visibleItems.length;

            showImage(currentIndex);
        }

        
        galleryItems.forEach(function(item) {
            item.addEventListener("click", function() {
                openLightbox(item);
            });

            
            item.addEventListener("keydown", function(event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openLightbox(item);
                }
            });
        });

        
        closeBtn.addEventListener("click", closeLightbox);
        nextBtn.addEventListener("click", showNext);
        prevBtn.addEventListener("click", showPrevious);

        
        lightbox.addEventListener("click", function(event) {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        
        document.addEventListener("keydown", function(event) {
            if (!lightbox.classList.contains("open")) {
                return;
            }

            if (event.key === "Escape") {
                closeLightbox();
            } else if (event.key === "ArrowRight") {
                showNext();
            } else if (event.key === "ArrowLeft") {
                showPrevious();
            }
        });
    </script>

</body>
</html>
